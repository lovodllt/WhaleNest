name: Host runtime
on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/**', 'tests/**', 'config/requirements.txt', '*.ps1', 'vendor/webox/Dockerfile', '.github/workflows/runtime.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r config/requirements.txt
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 scripts/release.py --output ../whalenest-ci-release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path *.ps1,scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
